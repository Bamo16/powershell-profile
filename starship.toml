# Agnoster-style: sharp powerline segments in One Dark's muted palette, on one line.
# Each segment opens with an arrow coloured prev_bg (whatever segment came before), so segments join
# seamlessly whichever of them are present; the format closes with one final arrow.
"$schema" = 'https://starship.rs/config-schema.json'

# Defaults are 30 ms to scan a directory and 500 ms per command, which a large repo or a cold
# `dotnet`/`python --version` overruns, printing [WARN] lines above the prompt.
scan_timeout = 100
command_timeout = 1500
add_newline = true

# The directory is always present, so every segment after it has a predecessor for prev_bg.
format = "${env_var.PROMPT_ELEVATED}$directory$git_branch$git_status$dotnet$python$status$cmd_duration[](fg:prev_bg) "

# Shown in an elevated session. src/Prompt.ps1 sets the variable once at startup.
[env_var.PROMPT_ELEVATED]
format = "[](fg:#d19a66)[  ](bg:#d19a66 fg:#1e2127)"

[directory]
truncation_length = 3
truncate_to_repo = true
truncation_symbol = ""
home_symbol = "~"
read_only = " "
# Opens with an arrow-shaped notch: the inverse arrow cut out of the segment colour. With nothing
# before it the notch shows the terminal background; after the elevated segment, that segment's colour.
format = "[](fg:#61afef bg:prev_bg)[ $path$read_only ](bg:#61afef fg:#1e2127)"

[git_branch]
symbol = " "
format = "[](fg:prev_bg bg:#98c379)[ $symbol$branch ](bg:#98c379 fg:#1e2127)"

[git_status]
format = "([](fg:prev_bg bg:#e5c07b)[ $all_status$ahead_behind ](bg:#e5c07b fg:#1e2127))"

# Shown only in a folder holding the marker files; see the README's Prompt section.
[dotnet]
# The C# glyph rather than the .NET wordmark: a Mono Nerd Font squeezes every icon into one cell,
# which leaves the wide wordmark unreadably small.
symbol = "󰌛 "
format = "[](fg:prev_bg bg:#c678dd)[ $symbol$version( $tfm) ](bg:#c678dd fg:#1e2127)"

[python]
symbol = " "
# A uv project's .venv first: uv runs it without activating, so the PATH python is the wrong version.
python_binary = [".venv/Scripts/python.exe", "python"]
format = "[](fg:prev_bg bg:#c678dd)[ $symbol$version( $virtualenv) ](bg:#c678dd fg:#1e2127)"

[status]
disabled = false
symbol = ""
format = "[](fg:prev_bg bg:#e06c75)[ $symbol $status ](bg:#e06c75 fg:#1e2127)"

[cmd_duration]
min_time = 2000
format = "[](fg:prev_bg bg:#5c6370)[  $duration ](bg:#5c6370 fg:#dcdfe4)"
