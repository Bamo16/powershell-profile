# Agnoster-style: sharp powerline segments in One Dark's muted palette, on one line.
# Each segment closes with an arrow on the terminal background, so a segment can be absent (no repo,
# no changes, no error) without leaving a coloured sliver behind.
"$schema" = 'https://starship.rs/config-schema.json'

# Defaults are 30 ms to scan a directory and 500 ms per command, which a large repo or a cold
# `dotnet`/`python --version` overruns, printing [WARN] lines above the prompt.
scan_timeout = 100
command_timeout = 1500
add_newline = true

format = "$status$directory$git_branch$git_status$dotnet$python$cmd_duration "

[status]
disabled = false
symbol = ""
format = "[ $symbol $status ](bg:#e06c75 fg:#1e2127)[](fg:#e06c75)"

[directory]
truncation_length = 3
truncate_to_repo = true
truncation_symbol = ""
home_symbol = "~"
read_only = " "
format = "[ $path$read_only ](bg:#61afef fg:#1e2127)[](fg:#61afef)"

[git_branch]
symbol = " "
format = "[ $symbol$branch ](bg:#98c379 fg:#1e2127)[](fg:#98c379)"

[git_status]
format = "([ $all_status$ahead_behind ](bg:#e5c07b fg:#1e2127)[](fg:#e5c07b))"

[cmd_duration]
min_time = 2000
format = "[  $duration ](bg:#5c6370 fg:#dcdfe4)[](fg:#5c6370)"

# Shown only in a folder holding the marker files; see the README's Prompt section.
[dotnet]
symbol = "󰪮 "
format = "[ $symbol$version( $tfm) ](bg:#c678dd fg:#1e2127)[](fg:#c678dd)"

[python]
symbol = " "
# A uv project's .venv first: uv runs it without activating, so the PATH python is the wrong version.
python_binary = [".venv/Scripts/python.exe", "python"]
format = "[ $symbol$version( $virtualenv) ](bg:#c678dd fg:#1e2127)[](fg:#c678dd)"

